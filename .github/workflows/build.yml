name: Build ZineROM One UI 7 (Galaxy A11)

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: "Only audit source/target fingerprint and VNDK firmware inputs"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - manus/a115f-build-once
      - manus/a115f-vendor-fingerprint

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a115f]

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false

      - name: Test A115F ZIP and firmware-layout validators
        run: python3 -m unittest discover -s tests -v

      - name: Checkout required build submodules
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --depth=1 --recursive \
              external/android-tools \
              external/apktool \
              external/erofs-utils \
              external/img2sdat \
              external/samloader \
              external/signapk; then
              exit 0
            fi
            echo "Submodule checkout failed (attempt ${attempt}/5); retrying..."
            sleep $((attempt * 20))
          done
          echo "Submodule checkout failed after 5 attempts"
          exit 1

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b
        with:
          retain: 'compiler_cmake,vcs'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Install pinned Samloader
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip \
            --output /tmp/samloader.zip
          echo "f6029dcce75b8a66acc1975529085c53903f7cdb35505e0ac0a973f2652480ff  /tmp/samloader.zip" | sha256sum --check --status
          unzip -p /tmp/samloader.zip samloader > /tmp/samloader
          chmod 0755 /tmp/samloader
          sudo install -m 0755 /tmp/samloader /usr/local/bin/samloader
          samloader --version

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download, validate, and extract pinned Samsung firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/import_samfw_firmware.sh

      - name: Audit A115F fingerprint inputs
        continue-on-error: true
        run: |
          python3 scripts/audit_a115f_fingerprint.py \
            --donor-framework out/fw/SM-A057F_TUR/system/system/framework/framework.jar \
            --target-vendor out/fw/SM-A115F_MWD/vendor \
            --source-config unica/configs/qssi.sh \
            --target-config target/a115f/config.sh \
            --source-system out/fw/SM-A057F_TUR \
            --target-system out/fw/SM-A115F_MWD

      - name: Audit A115F boot chain, vendor ABI, and partition layout
        run: |
          set -o pipefail
          mkdir -p out
          python3 scripts/audit_a115f_boot.py out/fw/SM-A115F_MWD | tee out/a115f-boot-audit.txt

      - name: Upload private A115F boot audit
        if: ${{ inputs.audit_only == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZineROM-A115F-boot-audit-${{ github.run_number }}
          path: |
            out/a115f-boot-audit.txt
            out/fw/SM-A115F_MWD/os_partitions_metadata.txt
            out/fw/SM-A115F_MWD/super_lpdump.txt
            out/fw/SM-A115F_MWD/boot.img_metadata.txt
            out/fw/SM-A115F_MWD/dtbo.img_metadata.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Build ROM
        if: ${{ inputs.audit_only != true }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Verify ZIP
        if: ${{ inputs.audit_only != true }}
        run: |
          test -s out/ZineROM_OneUI7_A115F-Port-A057F.zip
          python3 scripts/validate_a115f_zip.py out/ZineROM_OneUI7_A115F-Port-A057F.zip
          sha256sum out/ZineROM_OneUI7_A115F-Port-A057F.zip

      - name: Upload private ZIP artifact
        if: ${{ inputs.audit_only != true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZineROM_OneUI7_A115F-Port-A057F-${{ github.run_number }}
          path: out/ZineROM_OneUI7_A115F-Port-A057F.zip
          if-no-files-found: error
          retention-days: 90
